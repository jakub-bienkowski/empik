databaseChangeLog:
  - changeSet:
      id: 001-create-coupon-tables
      author: Jakub Bieńkowski
      changes:
        - createTable:
            tableName: coupons
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_coupons
                    nullable: false
              - column:
                  name: code
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_coupons_code
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: country_code
                  type: varchar(2)
                  constraints:
                    nullable: false
              - column:
                  name: max_usages
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: current_usages
                  type: integer
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
        - createTable:
            tableName: coupon_redemptions
            columns:
              - column:
                  name: coupon_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: redeemed_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: coupon_redemptions
            columnNames: coupon_id, user_id
            constraintName: pk_coupon_redemptions
        - addForeignKeyConstraint:
            baseTableName: coupon_redemptions
            baseColumnNames: coupon_id
            referencedTableName: coupons
            referencedColumnNames: id
            constraintName: fk_coupon_redemptions_coupon
        - sql:
            sql: >-
              ALTER TABLE coupons
              ADD CONSTRAINT ck_coupons_country_code CHECK (country_code ~ '^[A-Z]{2}$'),
              ADD CONSTRAINT ck_coupons_usage_bounds
              CHECK (max_usages > 0 AND current_usages BETWEEN 0 AND max_usages)
      rollback:
        - dropTable:
            tableName: coupon_redemptions
        - dropTable:
            tableName: coupons
