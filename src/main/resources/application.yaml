server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  webflux:
    base-path: ${API_BASE_PATH:/empik}
    problemdetails:
      enabled: true
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:empik}
    username: ${DB_USER:empik}
    password: ${DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:empik}
    user: ${spring.r2dbc.username}
    password: ${spring.r2dbc.password}

app:
  client-ip-header: ${CLIENT_IP_HEADER:X-Forwarded-For}

ipinfo:
  base-url: ${IPINFO_BASE_URL:https://api.ipinfo.io}
  token: ${IPINFO_TOKEN:}
  connect-timeout-ms: ${IPINFO_CONNECT_TIMEOUT_MS:1000}
  response-timeout-ms: ${IPINFO_RESPONSE_TIMEOUT_MS:2000}
  lookup-timeout-ms: ${IPINFO_LOOKUP_TIMEOUT_MS:3000}
  cache:
    # Per-instance IP-to-country cache; set maximum-size to 0 to disable retention.
    maximum-size: ${IPINFO_CACHE_MAXIMUM_SIZE:10000}
    ttl: ${IPINFO_CACHE_TTL:1h}
