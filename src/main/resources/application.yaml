server:
  port: ${SERVER_PORT:8080}

spring:
  webflux:
    base-path: ${API_BASE_PATH:/empik}
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:empik}
    username: ${DB_USER:empik}
    password: ${DB_PASSWORD:}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:empik}
    user: ${spring.r2dbc.username}
    password: ${spring.r2dbc.password}
